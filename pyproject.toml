[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-decomp-64"
version = "0.1.0"
description = "The N64 decompilation dev cycle and its seat over unbake, Recipe Maker and Cake Taste"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
# Our own tools are bare names: each installs itself into the toolkit at its landed commit, and a clean install (bin/test
# makes .venv from this list) resolves each name to the commit its source repository has landed at (abu_decomp.sources.PACKAGES).
dependencies = [
  "abucache",
  "textual==8.2.8",
  "pycparser==3.0",
  "gcovr==8.3",
  "pillow==13.0.0",  # shared capture decoder + bounded JPEG video for the TAS viewer
  "unbake",
  "recipemaker",
  "cake-taste-64",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "pytest==9.1.1", "numpy==2.2.4", "mypy==2.3.1"]  # numpy: RageWarsEnhanced shim/boot/lockstep.py, loaded by tests/test_check_run.py, test_lockstep.py, test_run_coverage.py

[project.scripts]
decomp = "abu_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abu_decomp", "abu_decomp.*"]

# The port template (dot-dirs and .gitkeep included) ships through MANIFEST.in: setuptools package-data globs skip dot-files.
[tool.setuptools.package-data]
"abu_decomp.build" = ["SCHEMA.md"]
"abu_decomp" = ["runner.html", "static/*", "static/site/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]  # a bare pytest imports this tree, never the venv copy
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/abu_decomp/data/*.py" = ["E501", "UP031"]  # report rows and evidence strings read better unwrapped
"tests/test_data_*.py" = ["E501"]
